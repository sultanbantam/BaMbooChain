<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BaMbooChain</title>
    <script>
      (function () {
        var primaryCustomHost = 'www.bamboochain.id';
        var customHosts = ['bamboochain.id', primaryCustomHost];
        var githubPagesHost = 'sultanbantam.github.io';
        var isGitHubPages = window.location.hostname === githubPagesHost;
        var isCustomHost = customHosts.indexOf(window.location.hostname) !== -1;
        var isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '::1';
        var repoBase = isGitHubPages ? '/BaMbooChain/' : '/';
        var locationRef = window.location;
        var path = locationRef.pathname;

        function toHashRoute(routePath) {
          var cleanPath = routePath.replace(/^\/+/, '');
          return cleanPath ? '#/' + cleanPath : '#/';
        }

        if (!isGitHubPages && !isCustomHost && !isLocalHost) {
          locationRef.replace('https://' + primaryCustomHost + '/' + toHashRoute(path) + locationRef.search);
          return;
        }

        if (path.indexOf(repoBase) !== 0) {
          locationRef.replace(locationRef.origin + repoBase);
          return;
        }

        var routePath = path.slice(repoBase.length);
        var hashRoute = toHashRoute(routePath);
        locationRef.replace(locationRef.origin + repoBase + hashRoute + locationRef.search + locationRef.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
